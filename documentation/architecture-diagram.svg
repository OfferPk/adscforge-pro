<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B10" />
      <stop offset="100%" stop-color="#0E1726" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121C2B" />
      <stop offset="100%" stop-color="#0D1522" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1000" height="650" fill="url(#bgGrad)" />

  <!-- Title Banner -->
  <rect x="30" y="25" width="940" height="60" rx="8" fill="url(#panelGrad)" stroke="#1F2D42" stroke-width="1.5" />
  <text x="50" y="62" font-family="-apple-system, sans-serif" font-size="20" font-weight="bold" fill="#E2E8F0">
    ADSCForge Pro (v1.0.0) — Automatic Dependent Surveillance - Contract Architecture
  </text>
  <text x="690" y="61" font-family="monospace" font-size="12" fill="#00E5FF">
    RTCA DO-258A • EUROCAE ED-100A • ICAO GOLD
  </text>

  <!-- Left Block: Aircraft Avionics & Sensors -->
  <g transform="translate(30, 110)" filter="url(#shadow)">
    <rect width="260" height="490" rx="8" fill="url(#panelGrad)" stroke="#1F2D42" stroke-width="1.5" />
    <text x="20" y="35" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold" fill="#00E5FF">1. Airborne FMS &amp; Sensors</text>
    <line x1="20" y1="48" x2="240" y2="48" stroke="#1F2D42" stroke-width="1" />

    <rect x="15" y="65" width="230" height="65" rx="4" fill="#090E17" stroke="#1B283A" />
    <text x="25" y="88" font-family="monospace" font-size="11" font-weight="bold" fill="#E2E8F0">Multi-Sensor GNSS / IRS</text>
    <text x="25" y="104" font-family="monospace" font-size="10" fill="#8E9CAE">WGS-84 Latitude &amp; Longitude</text>
    <text x="25" y="118" font-family="monospace" font-size="10" fill="#00E676">Figure of Merit (FOM 0-7 Accuracy)</text>

    <rect x="15" y="145" width="230" height="65" rx="4" fill="#090E17" stroke="#1B283A" />
    <text x="25" y="168" font-family="monospace" font-size="11" font-weight="bold" fill="#E2E8F0">Flight Management Computer</text>
    <text x="25" y="184" font-family="monospace" font-size="10" fill="#8E9CAE">Assigned FL &amp; Trajectory Intent</text>
    <text x="25" y="198" font-family="monospace" font-size="10" fill="#00B4D8">Next Waypoint &amp; Next+1 Waypoint ETO</text>

    <rect x="15" y="225" width="230" height="65" rx="4" fill="#090E17" stroke="#1B283A" />
    <text x="25" y="248" font-family="monospace" font-size="11" font-weight="bold" fill="#E2E8F0">Air Data &amp; Inertial System</text>
    <text x="25" y="264" font-family="monospace" font-size="10" fill="#8E9CAE">Pressure Alt (FL), True Airspeed</text>
    <text x="25" y="278" font-family="monospace" font-size="10" fill="#8E9CAE">Vertical Speed (Vz fpm) &amp; Mach</text>

    <rect x="15" y="305" width="230" height="65" rx="4" fill="#090E17" stroke="#1B283A" />
    <text x="25" y="328" font-family="monospace" font-size="11" font-weight="bold" fill="#E2E8F0">Environmental &amp; Met Sensors</text>
    <text x="25" y="344" font-family="monospace" font-size="10" fill="#8E9CAE">Static Air Temp (OAT/TAT °C)</text>
    <text x="25" y="358" font-family="monospace" font-size="10" fill="#FFB800">Wind Speed (kts) &amp; True Direction</text>

    <rect x="15" y="385" width="230" height="75" rx="4" fill="#090E17" stroke="#1B283A" />
    <text x="25" y="408" font-family="monospace" font-size="11" font-weight="bold" fill="#E2E8F0">Cockpit Emergency Switch</text>
    <text x="25" y="424" font-family="monospace" font-size="10" fill="#8E9CAE">Mayday / 7700 Discrete Activation</text>
    <text x="25" y="438" font-family="monospace" font-size="10" fill="#FF2A4B">Instant 64s Emergency Preemption</text>
  </g>

  <!-- Center Block: ADS-C Contract & Report Engine -->
  <g transform="translate(320, 110)" filter="url(#shadow)">
    <rect width="360" height="490" rx="8" fill="url(#panelGrad)" stroke="#1F2D42" stroke-width="1.5" />
    <text x="20" y="35" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold" fill="#00E5FF">2. ADS-C Contract Processing Core</text>
    <line x1="20" y1="48" x2="340" y2="48" stroke="#1F2D42" stroke-width="1" />

    <!-- Sub-kernel A: Contract Management -->
    <rect x="15" y="60" width="330" height="195" rx="6" fill="#090E17" stroke="#00B4D8" stroke-width="1" />
    <text x="25" y="85" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#00B4D8">DO-258A Contract State Machine</text>
    <text x="25" y="108" font-family="monospace" font-size="10" fill="#E2E8F0">• Periodic Contract: 64s to 1920s Rate</text>
    <text x="25" y="126" font-family="monospace" font-size="10" fill="#E2E8F0">• Waypoint Change Event Trigger (Sequenced)</text>
    <text x="25" y="144" font-family="monospace" font-size="10" fill="#E2E8F0">• Lateral Deviation: |XTRK| >= Threshold (NM)</text>
    <text x="25" y="162" font-family="monospace" font-size="10" fill="#E2E8F0">• Altitude Out-of-Range: |Δh| >= Threshold (ft)</text>
    <text x="25" y="180" font-family="monospace" font-size="10" fill="#E2E8F0">• Vertical Rate Event: |Vz| >= Threshold (fpm)</text>
    <text x="25" y="198" font-family="monospace" font-size="10" fill="#FF2A4B">• Emergency Mode: Autonomous 64s Cycling</text>

    <!-- Sub-kernel B: Report Group Assembly -->
    <rect x="15" y="270" width="330" height="205" rx="6" fill="#090E17" stroke="#00E676" stroke-width="1" />
    <text x="25" y="295" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#00E676">ICAO Doc 10037 Report Assembly</text>
    <text x="25" y="318" font-family="monospace" font-size="10" fill="#E2E8F0">• Mandatory Basic Group: Pos, FL, UTC, FOM</text>
    <text x="25" y="336" font-family="monospace" font-size="10" fill="#E2E8F0">• Flight Intent Group: Next &amp; Next+1 Fix + ETO</text>
    <text x="25" y="354" font-family="monospace" font-size="10" fill="#E2E8F0">• Meteorological Group: Wind, Temp, Turbulence</text>
    <text x="25" y="372" font-family="monospace" font-size="10" fill="#E2E8F0">• Earth Reference Group: True Track, Ground Speed</text>
    <text x="25" y="390" font-family="monospace" font-size="10" fill="#E2E8F0">• Air Reference Group: TAS, Mag Heading, Mach</text>
    <text x="25" y="408" font-family="monospace" font-size="10" fill="#E2E8F0">• ARINC 622 Character Encapsulation</text>
  </g>

  <!-- Right Block: Oceanic Ground ATC Systems -->
  <g transform="translate(710, 110)" filter="url(#shadow)">
    <rect width="260" height="490" rx="8" fill="url(#panelGrad)" stroke="#1F2D42" stroke-width="1.5" />
    <text x="20" y="35" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold" fill="#00E5FF">3. Oceanic Airspace ATSUs</text>
    <line x1="20" y1="48" x2="240" y2="48" stroke="#1F2D42" stroke-width="1" />

    <rect x="15" y="65" width="230" height="70" rx="4" fill="#090E17" stroke="#00E676" stroke-width="1.5" />
    <text x="25" y="88" font-family="monospace" font-size="11" font-weight="bold" fill="#00E676">Shanwick Oceanic (EGGX)</text>
    <text x="25" y="106" font-family="monospace" font-size="10" fill="#E2E8F0">NATS Oceanic ATM Automation</text>
    <text x="25" y="122" font-family="monospace" font-size="10" fill="#8E9CAE">Eastern North Atlantic Corridor</text>

    <rect x="15" y="150" width="230" height="70" rx="4" fill="#090E17" stroke="#00B4D8" stroke-width="1.5" />
    <text x="25" y="173" font-family="monospace" font-size="11" font-weight="bold" fill="#00B4D8">Gander Oceanic (CZQX)</text>
    <text x="25" y="191" font-family="monospace" font-size="10" fill="#E2E8F0">Nav Canada GAATS+ System</text>
    <text x="25" y="207" font-family="monospace" font-size="10" fill="#8E9CAE">Western North Atlantic Boundary</text>

    <rect x="15" y="235" width="230" height="70" rx="4" fill="#090E17" stroke="#FFB800" stroke-width="1.5" />
    <text x="25" y="258" font-family="monospace" font-size="11" font-weight="bold" fill="#FFB800">New York Oceanic (KZWY)</text>
    <text x="25" y="276" font-family="monospace" font-size="10" fill="#E2E8F0">FAA ATOP Oceanic Display</text>
    <text x="25" y="292" font-family="monospace" font-size="10" fill="#8E9CAE">WATRS / West Atlantic Route System</text>

    <rect x="15" y="320" width="230" height="70" rx="4" fill="#090E17" stroke="#00E5FF" stroke-width="1.5" />
    <text x="25" y="343" font-family="monospace" font-size="11" font-weight="bold" fill="#00E5FF">Reduced Separation Corridors</text>
    <text x="25" y="361" font-family="monospace" font-size="10" fill="#E2E8F0">RLatSM (14 NM / 23 NM Lateral)</text>
    <text x="25" y="377" font-family="monospace" font-size="10" fill="#8E9CAE">Rongelap &amp; Pacific Tracks (PACOTS)</text>

    <rect x="15" y="405" width="230" height="65" rx="4" fill="#090E17" stroke="#E2E8F0" stroke-width="1" />
    <text x="25" y="428" font-family="monospace" font-size="11" font-weight="bold" fill="#E2E8F0">Search &amp; Rescue (SAR)</text>
    <text x="25" y="446" font-family="monospace" font-size="10" fill="#8E9CAE">RCC Mission Control Handover</text>
    <text x="25" y="460" font-family="monospace" font-size="10" fill="#8E9CAE">Emergency Distress Vector Tracking</text>
  </g>

  <!-- Connective Arrows -->
  <line x1="290" y1="230" x2="320" y2="230" stroke="#00B4D8" stroke-width="2" />
  <polygon points="318,226 326,230 318,234" fill="#00B4D8" />

  <line x1="290" y1="410" x2="320" y2="410" stroke="#FFB800" stroke-width="2" />
  <polygon points="318,406 326,410 318,414" fill="#FFB800" />

  <line x1="680" y1="210" x2="710" y2="210" stroke="#00E676" stroke-width="2" />
  <polygon points="708,206 716,210 708,214" fill="#00E676" />

  <line x1="680" y1="370" x2="710" y2="370" stroke="#00E5FF" stroke-width="2" />
  <polygon points="708,366 716,370 708,374" fill="#00E5FF" />
</svg>