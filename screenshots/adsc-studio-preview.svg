<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="studioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B10" />
      <stop offset="100%" stop-color="#0A1017" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1724" />
      <stop offset="100%" stop-color="#090E16" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#studioBg)" />

  <!-- Top App Bar -->
  <rect x="20" y="20" width="1160" height="65" rx="8" fill="url(#cardGrad)" stroke="#1F2D42" stroke-width="1.5" />
  <text x="45" y="58" font-family="-apple-system, sans-serif" font-size="22" font-weight="bold" fill="#E2E8F0">
    🛰️ ADSCForge <tspan fill="#00E5FF">Pro</tspan> <tspan font-size="14" fill="#8E9CAE" font-weight="normal">(v1.0.0)</tspan>
  </text>
  <rect x="710" y="38" width="280" height="28" rx="4" fill="rgba(0,230,118,0.12)" stroke="#00E676" stroke-width="1" />
  <text x="722" y="56" font-family="monospace" font-size="11" font-weight="bold" fill="#00E676">● RTCA DO-258A &amp; ICAO GOLD CERTIFIED</text>
  <text x="1030" y="56" font-family="monospace" font-size="12" fill="#8E9CAE">UTC 03:45:00Z</text>

  <!-- Presets Bar -->
  <rect x="20" y="98" width="1160" height="48" rx="6" fill="#0C131D" stroke="#1F2D42" />
  <text x="35" y="128" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#8E9CAE">PRESETS:</text>

  <rect x="110" y="108" width="190" height="28" rx="4" fill="rgba(0,229,255,0.15)" stroke="#00E5FF" />
  <text x="122" y="126" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#00E5FF">⏱️ Normal Periodic (840s)</text>

  <rect x="310" y="108" width="210" height="28" rx="4" fill="#121C2B" stroke="#1F2D42" />
  <text x="322" y="126" font-family="-apple-system, sans-serif" font-size="11" fill="#E2E8F0">↔️ Lateral Deviation Event</text>

  <rect x="530" y="108" width="210" height="28" rx="4" fill="#121C2B" stroke="#1F2D42" />
  <text x="542" y="126" font-family="-apple-system, sans-serif" font-size="11" fill="#E2E8F0">↕️ Altitude Out-of-Range</text>

  <rect x="750" y="108" width="210" height="28" rx="4" fill="#121C2B" stroke="#1F2D42" />
  <text x="762" y="126" font-family="-apple-system, sans-serif" font-size="11" fill="#E2E8F0">📌 Waypoint Sequencing</text>

  <rect x="970" y="108" width="195" height="28" rx="4" fill="#121C2B" stroke="#1F2D42" />
  <text x="982" y="126" font-family="-apple-system, sans-serif" font-size="11" fill="#FF2A4B">🚨 Emergency (64s Cycle)</text>

  <!-- Annunciators Row -->
  <g transform="translate(20, 160)">
    <rect x="0" y="0" width="180" height="44" rx="4" fill="rgba(0,230,118,0.15)" stroke="#00E676" stroke-width="2" />
    <text x="90" y="27" font-family="monospace" font-size="11" font-weight="bold" fill="#00E676" text-anchor="middle">PERIODIC: 840s ACTIVE</text>

    <rect x="195" y="0" width="180" height="44" rx="4" fill="#090E17" stroke="#1E2D42" stroke-width="2" />
    <text x="285" y="27" font-family="monospace" font-size="11" font-weight="bold" fill="#37475F" text-anchor="middle">LATERAL DEVIATION</text>

    <rect x="390" y="0" width="185" height="44" rx="4" fill="#090E17" stroke="#1E2D42" stroke-width="2" />
    <text x="482" y="27" font-family="monospace" font-size="11" font-weight="bold" fill="#37475F" text-anchor="middle">ALTITUDE OUT OF RANGE</text>

    <rect x="590" y="0" width="185" height="44" rx="4" fill="#090E17" stroke="#1E2D42" stroke-width="2" />
    <text x="682" y="27" font-family="monospace" font-size="11" font-weight="bold" fill="#37475F" text-anchor="middle">VERTICAL RATE EXCEEDED</text>

    <rect x="790" y="0" width="185" height="44" rx="4" fill="#090E17" stroke="#1E2D42" stroke-width="2" />
    <text x="882" y="27" font-family="monospace" font-size="11" font-weight="bold" fill="#37475F" text-anchor="middle">WAYPOINT CHANGE EVENT</text>

    <rect x="990" y="0" width="170" height="44" rx="4" fill="#090E17" stroke="#1E2D42" stroke-width="2" />
    <text x="1075" y="27" font-family="monospace" font-size="11" font-weight="bold" fill="#37475F" text-anchor="middle">EMERGENCY MODE</text>
  </g>

  <!-- Left Column: Controls (Width 360) -->
  <g transform="translate(20, 220)">
    <rect width="360" height="555" rx="8" fill="url(#cardGrad)" stroke="#1F2D42" />
    <text x="20" y="32" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#00E5FF">Flight Dynamics &amp; Telemetry</text>

    <!-- Sliders -->
    <text x="20" y="65" font-family="-apple-system, sans-serif" font-size="11" fill="#8E9CAE">Cross-Track Error (XTRK): <tspan fill="#00B4D8" font-family="monospace" font-weight="bold">+0.00 NM</tspan></text>
    <rect x="20" y="73" width="320" height="4" rx="2" fill="#1E2A3A" />
    <rect x="20" y="73" width="160" height="4" rx="2" fill="#00B4D8" />
    <circle cx="180" cy="75" r="7" fill="#FFF" />

    <text x="20" y="110" font-family="-apple-system, sans-serif" font-size="11" fill="#8E9CAE">Altitude Deviation (Δh): <tspan fill="#00B4D8" font-family="monospace" font-weight="bold">+0 ft (FL370)</tspan></text>
    <rect x="20" y="118" width="320" height="4" rx="2" fill="#1E2A3A" />
    <rect x="20" y="118" width="160" height="4" rx="2" fill="#00B4D8" />
    <circle cx="180" cy="120" r="7" fill="#FFF" />

    <text x="20" y="155" font-family="-apple-system, sans-serif" font-size="11" fill="#8E9CAE">Vertical Speed (Vz): <tspan fill="#00B4D8" font-family="monospace" font-weight="bold">0 fpm</tspan></text>
    <rect x="20" y="163" width="320" height="4" rx="2" fill="#1E2A3A" />
    <rect x="20" y="163" width="160" height="4" rx="2" fill="#00B4D8" />
    <circle cx="180" cy="165" r="7" fill="#FFF" />

    <text x="20" y="200" font-family="-apple-system, sans-serif" font-size="11" fill="#8E9CAE">Figure of Merit: <tspan fill="#00E676" font-family="monospace" font-weight="bold">FOM 7 (&lt;0.05 NM / RNP AR)</tspan></text>
    <rect x="20" y="208" width="320" height="4" rx="2" fill="#1E2A3A" />
    <rect x="20" y="208" width="320" height="4" rx="2" fill="#00E676" />
    <circle cx="340" cy="210" r="7" fill="#FFF" />

    <!-- Discretes -->
    <rect x="20" y="240" width="155" height="30" rx="4" fill="#121C2B" stroke="#1F2D42" />
    <text x="97" y="260" font-family="monospace" font-size="10" fill="#8E9CAE" text-anchor="middle">WAYPOINT: EN-ROUTE</text>

    <rect x="185" y="240" width="155" height="30" rx="4" fill="#121C2B" stroke="#1F2D42" />
    <text x="262" y="260" font-family="monospace" font-size="10" fill="#8E9CAE" text-anchor="middle">EMERGENCY: OFF</text>

    <!-- Contract Panel Summary -->
    <rect x="20" y="295" width="320" height="235" rx="6" fill="#060A10" stroke="#1E2D42" />
    <text x="35" y="320" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#00E5FF">Connected ATSU Peer Contracts</text>
    <text x="35" y="345" font-family="monospace" font-size="11" fill="#E2E8F0">• Primary ATSU: Shanwick Oceanic (EGGX)</text>
    <text x="35" y="365" font-family="monospace" font-size="11" fill="#E2E8F0">• Periodic Rate: 840s (14-min interval)</text>
    <text x="35" y="385" font-family="monospace" font-size="11" fill="#E2E8F0">• Standby ATSU: Gander Oceanic (CZQX)</text>
    <text x="35" y="405" font-family="monospace" font-size="11" fill="#FFB800">• Lateral Deviation Threshold: ±2.0 NM</text>
    <text x="35" y="425" font-family="monospace" font-size="11" fill="#FFB800">• Altitude Window Threshold: ±300 ft</text>
    <text x="35" y="445" font-family="monospace" font-size="11" fill="#FFB800">• Vertical Rate Threshold: ±500 fpm</text>
    <text x="35" y="465" font-family="monospace" font-size="11" fill="#00E676">• Waypoint Change Event: ACTIVE</text>
    <text x="35" y="485" font-family="monospace" font-size="11" fill="#8E9CAE">• Subnetwork Media: SATCOM Inmarsat SBB</text>
    <text x="35" y="505" font-family="monospace" font-size="11" fill="#8E9CAE">• Protocol Grounding: RTCA DO-258A FANS</text>
  </g>

  <!-- Right Visual Panels -->
  <!-- Oceanic Radar Map View -->
  <g transform="translate(400, 220)">
    <rect width="780" height="240" rx="8" fill="#05080E" stroke="#1F2D42" />
    <text x="20" y="28" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#00E5FF">North Atlantic Oceanic Track Display (Plan View)</text>
    <text x="500" y="28" font-family="monospace" font-size="11" fill="#00E676">NAT HLA SEPARATION CORRIDOR</text>

    <!-- FIR Boundary -->
    <line x1="400" y1="40" x2="400" y2="220" stroke="#1E2D42" stroke-dasharray="4,4" stroke-width="1.5" />
    <text x="390" y="55" font-family="monospace" font-size="9" fill="#8E9CAE" text-anchor="end">SHANWICK FIR (EGGX)</text>
    <text x="410" y="55" font-family="monospace" font-size="9" fill="#8E9CAE">GANDER FIR (CZQX)</text>

    <!-- Separation Buffer Bands -->
    <line x1="40" y1="95" x2="740" y2="95" stroke="#FFB800" stroke-dasharray="3,3" stroke-width="1" opacity="0.5" />
    <text x="745" y="99" font-family="monospace" font-size="8" fill="#FFB800">+2.0 NM</text>

    <line x1="40" y1="165" x2="740" y2="165" stroke="#FFB800" stroke-dasharray="3,3" stroke-width="1" opacity="0.5" />
    <text x="745" y="169" font-family="monospace" font-size="8" fill="#FFB800">-2.0 NM</text>

    <!-- Centerline -->
    <line x1="40" y1="130" x2="740" y2="130" stroke="#00B4D8" stroke-width="2.5" />
    <text x="50" y="122" font-family="monospace" font-size="9" font-weight="bold" fill="#00B4D8">NAT TRACK CHARLIE (CENTERLINE)</text>

    <!-- Waypoints -->
    <circle cx="160" cy="130" r="5" fill="#00E5FF" />
    <text x="160" y="150" font-family="monospace" font-size="10" fill="#00E5FF" text-anchor="middle">NIBOG</text>

    <circle cx="400" cy="130" r="5" fill="#00E5FF" />
    <text x="400" y="150" font-family="monospace" font-size="11" font-weight="bold" fill="#00E5FF" text-anchor="middle">GOMUP (30°W)</text>

    <circle cx="640" cy="130" r="5" fill="#00E5FF" />
    <text x="640" y="150" font-family="monospace" font-size="10" fill="#00E5FF" text-anchor="middle">LIMRI</text>

    <!-- Aircraft Symbol -->
    <polygon points="340,120 334,135 340,130 346,135" fill="#FFF" stroke="#00E5FF" stroke-width="1.5" />
    <text x="350" y="125" font-family="monospace" font-size="11" font-weight="bold" fill="#00E5FF">EK201 (FL370 / 464 KT)</text>
  </g>

  <!-- Report Card Group Inspector -->
  <g transform="translate(400, 475)">
    <rect width="780" height="135" rx="8" fill="url(#cardGrad)" stroke="#1F2D42" />
    <text x="20" y="24" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#00E5FF">ADS-C Downlink Report Groups Inspector (RTCA DO-258A)</text>
    <text x="530" y="24" font-family="monospace" font-size="10" fill="#00E676">REASON: PERIODIC_REPORT (840s)</text>

    <text x="25" y="48" font-family="monospace" font-size="11" fill="#8E9CAE">BASIC GROUP:</text>
    <text x="135" y="48" font-family="monospace" font-size="11" font-weight="bold" fill="#00E5FF">55°25.20'N 030°30.00'W • FL370 (37,000') • FOM 7 (&lt;0.05 NM Accuracy)</text>

    <text x="25" y="70" font-family="monospace" font-size="11" fill="#8E9CAE">FLIGHT INTENT:</text>
    <text x="135" y="70" font-family="monospace" font-size="11" font-weight="bold" fill="#FFF">NEXT: GOMUP (0412Z @ FL370) -&gt; NIBOG (0448Z @ FL370)</text>

    <text x="25" y="92" font-family="monospace" font-size="11" fill="#8E9CAE">METEOROLOGY:</text>
    <text x="135" y="92" font-family="monospace" font-size="11" font-weight="bold" fill="#FFB800">WIND: 275° / 68 KT • STATIC AIR TEMP: -54°C • TURBULENCE: NONE</text>

    <text x="25" y="114" font-family="monospace" font-size="11" fill="#8E9CAE">EARTH / AIR:</text>
    <text x="135" y="114" font-family="monospace" font-size="11" font-weight="bold" fill="#00E676">TRUE TRACK: 282.5° • GS: 464 KT • TAS: 480 KT • MACH 0.84 • HDG: 295°</text>
  </g>

  <!-- 10-Point Normative Auditor Table -->
  <g transform="translate(400, 620)">
    <rect width="780" height="155" rx="8" fill="url(#cardGrad)" stroke="#1F2D42" />
    <text x="20" y="24" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#00E5FF">10-Point Normative ADS-C Compliance Audit</text>
    <rect x="540" y="8" width="220" height="22" rx="4" fill="rgba(0,230,118,0.15)" stroke="#00E676" />
    <text x="650" y="23" font-family="monospace" font-size="10" font-weight="bold" fill="#00E676" text-anchor="middle">SCORE: 10/10 (100.0% CERTIFIED)</text>

    <g transform="translate(20, 36)" font-family="monospace" font-size="9">
      <text y="14" fill="#00E5FF" font-weight="bold">RULE_01</text>
      <text x="70" y="14" fill="#E2E8F0">DO-258A Section 3.2.1: Periodic Contract Rate Negotiation (64s-1920s)</text>
      <text x="660" y="14" fill="#00E676" font-weight="bold">● PASSED</text>

      <text y="28" fill="#00E5FF" font-weight="bold">RULE_02</text>
      <text x="70" y="28" fill="#E2E8F0">DO-258A Section 3.2.2.1: Waypoint Change Event Triggering</text>
      <text x="660" y="28" fill="#00E676" font-weight="bold">● PASSED</text>

      <text y="42" fill="#00E5FF" font-weight="bold">RULE_03</text>
      <text x="70" y="42" fill="#E2E8F0">DO-258A Section 3.2.2.2: Lateral Deviation Event Trigger (|XTRK| &gt;= Thresh)</text>
      <text x="660" y="42" fill="#00E676" font-weight="bold">● PASSED</text>

      <text y="56" fill="#00E5FF" font-weight="bold">RULE_04</text>
      <text x="70" y="56" fill="#E2E8F0">DO-258A Section 3.2.2.3: Altitude Out-of-Range Event Trigger (|Δh| &gt;= 300&#39;)</text>
      <text x="660" y="56" fill="#00E676" font-weight="bold">● PASSED</text>

      <text y="70" fill="#00E5FF" font-weight="bold">RULE_05</text>
      <text x="70" y="70" fill="#E2E8F0">DO-258A Section 3.2.2.4: Vertical Rate Event Trigger (|Vz| &gt;= 500 fpm)</text>
      <text x="660" y="70" fill="#00E676" font-weight="bold">● PASSED</text>

      <text y="84" fill="#00E5FF" font-weight="bold">RULE_06</text>
      <text x="70" y="84" fill="#E2E8F0">ICAO Doc 10037 Section 4.4.1: Mandatory Basic Report Group (WGS-84 / FOM)</text>
      <text x="660" y="84" fill="#00E676" font-weight="bold">● PASSED</text>

      <text y="98" fill="#00E5FF" font-weight="bold">RULE_07</text>
      <text x="70" y="98" fill="#E2E8F0">DO-258A Table 3-1: Figure of Merit (FOM 0-7) Accuracy Scaling</text>
      <text x="660" y="98" fill="#00E676" font-weight="bold">● PASSED</text>

      <text y="112" fill="#00E5FF" font-weight="bold">RULE_10</text>
      <text x="70" y="112" fill="#E2E8F0">ICAO Doc 10037 Section 4.5: Emergency Mode Autonomous 64s Cycling</text>
      <text x="660" y="112" fill="#00E676" font-weight="bold">● PASSED</text>
    </g>
  </g>
</svg>